name: ETF flows

# Flows into BTC and ETH ETFs (Farside): hourly during the day it fetches the page with a browser, builds crypto-etfs.json and
# publishes it to the "data" branch (GitHub Pages). Farside fills in the data of the latest day during the day (e.g. IBIT is
# sometimes added later), so later runs correct it; while the day is incomplete, the JSON has a "preliminary" field.
on:
  schedule:
    - cron: '7 6-19 * * *'   # at :07 every hour, 6-19 UTC (8-21 Polish time in summer, 7-20 in winter)
  workflow_dispatch:

concurrency:
  group: publish-data        # one publication at a time (shared with the RSS workflow), a running one is never cancelled
  cancel-in-progress: false

permissions:
  contents: write            # pushing the "data" branch

jobs:
  etf:
    # Cloudflare (Farside) may block data-center addresses, including GitHub-hosted runners. In that case set the repository variable
    # ETF_RUNNER (Settings -> Secrets and variables -> Actions -> Variables) to the label of your own runner, e.g. "self-hosted".
    runs-on: ${{ vars.ETF_RUNNER || 'ubuntu-24.04' }}
    timeout-minutes: 20
    env:
      PYTHONPATH: src
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm

      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'

      - name: Dependencies (Playwright and Chromium)
        run: |
          npm ci
          npx playwright install --with-deps chromium

      - name: Fetch the Farside pages
        run: node scripts/scrape-etf.js out

      - name: Last published data
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: bash scripts/site-prepare.sh site data

      - name: Build crypto-etfs.json
        run: python -m finactions etf --html-dir out --out site

      - name: Publish
        run: bash scripts/site-publish.sh site data "etf"
